# dsh-token-gate — DSH Bundle patch.
#
# The gateway listens on its own port (default 0.0.0.0:3081) and proxies only
# authorized requests to the local DSH web server. Point cloudflared/caddy at
# this gateway port, never at the DSH port.
#
# Production is fail-closed: set DSH_AUTH_TOKEN in the DSH process environment
# or provide config.token in a private patch layer. Do not commit secrets here.
#
# Example:
#   - id: token-gate
#     config:
#       allowIps: ['192.168.1.0/24']
#       trustedProxies: ['127.0.0.0/8', '::1/128']
#
# Applied with: dsh plugin --profile web add .

- insert:
    - id: token-gate
      name: 'dsh-token-gate'

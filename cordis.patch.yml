# dsh-token-gate — DSH Bundle patch.
#
# The gateway listens on its own loopback port by default (127.0.0.1:3081)
# and requires the injected DSH webServer to stay on 127.0.0.1. Point a local
# cloudflared/caddy instance at the gateway port, never at the DSH port. Set
# config.bind to 0.0.0.0 only when direct network listening is intentional.
#
# Production is fail-closed: set DSH_AUTH_TOKEN in the DSH process environment
# or provide config.token in a private patch layer. Do not commit secrets here.
#
# Forwarded headers are NOT trusted by default. Example for a local Caddy:
#   - id: token-gate
#     config:
#       trustedProxies: ['127.0.0.1/32']
#       realIpHeader: 'x-forwarded-for'
#       trustedHosts: ['dsh.example.com'] # required for named-host IP allowlist bypass
#       allowIps: ['192.168.1.0/24']
#
# Applied with: dsh plugin --profile web add .

- insert:
    - id: token-gate
      name: 'dsh-token-gate'

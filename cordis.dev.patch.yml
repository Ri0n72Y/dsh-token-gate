#   dsh web --patch /ABSOLUTE/PATH/TO/dsh-token-gate/cordis.dev.patch.yml

- insert:
    - id: token-gate
      name: '/ABSOLUTE/PATH/TO/dsh-token-gate/src/index.ts'
